<!DOCTYPE html>
<html>
<head>
<style>
  body { background: #052a79; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  .logo { display: flex; align-items: center; gap: 5px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4)); }
  .text {
    font-family: 'Impact', 'Arial Black', sans-serif;
    font-size: 5rem;
    font-weight: 900;
    letter-spacing: 0.05em;
    background: linear-gradient(to bottom, #fde047 0%, #f59e0b 55%, #b45309 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="logo">
    <div class="text">FARE</div>
    
    <svg width="60" height="80" viewBox="0 0 100 130" style="margin: 0 4px; transform: translateY(5px);">
      <!-- Fuego base (gota azul) -->
      <path d="M 50,0 C 50,0 10,70 10,95 C 10,117 28,130 50,130 C 72,130 90,117 90,95 C 90,70 50,0 50,0 Z" fill="#25a5e3" />
      
      <!-- Fuego rojo interno (derecha) -->
      <path d="M 52,40 C 52,40 75,75 75,100 C 75,115 65,125 50,125 C 60,110 50,90 48,70 C 47,60 52,40 52,40 Z" fill="#e6201b" />

      <!-- Fuego amarillo interno (derecha centro) -->
      <path d="M 54,65 C 54,65 67,85 67,105 C 67,115 60,120 52,120 C 58,110 52,95 50,85 C 49,80 54,65 54,65 Z" fill="#fbd304" />
      
      <!-- Brillo azul claro (izquierda) -->
      <path d="M 20,95 C 20,80 35,45 45,25 C 35,45 25,75 25,95 C 25,105 32,115 40,120 C 30,115 20,105 20,95 Z" fill="#69c8f5" opacity="0.8" />
    </svg>

    <div class="text">GAS</div>
  </div>
</body>
</html>
