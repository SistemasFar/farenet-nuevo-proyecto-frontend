<!doctype html>
<html lang="en">

<head>

<script>
window.addEventListener('error', function(event) {
  fetch('http://localhost:3333/log-error', {
    method: 'POST',
    body: event.error ? event.error.stack : event.message
  }).catch(()=>console.log('could not send'));
});
window.addEventListener('unhandledrejection', function(event) {
  fetch('http://localhost:3333/log-error', {
    method: 'POST',
    body: event.reason ? event.reason.stack : 'promise rejection'
  }).catch(()=>console.log('could not send'));
});
</script>
